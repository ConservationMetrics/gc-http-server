captainVersion: 4

services:
  $$cap_appname:
    image: $$cap_gc_http_server_docker_image
    restart: unless-stopped
    volumes:
      # Mount the whole host datalake once. Changing DIRECTORY does not require
      # updating Persistent Directories — only the DIRECTORY env var.
      - $$cap_data_mount:/data_mount
    environment:
      DIRECTORY: $$cap_directory
      DATA_DIRECTORY: $$cap_data_directory
      AUTH_ENABLED: $$cap_auth_enabled
      OAUTH2_PROXY_OIDC_ISSUER_URL: $$cap_auth0_issuer_url
      OAUTH2_PROXY_CLIENT_ID: $$cap_auth0_client_id
      OAUTH2_PROXY_CLIENT_SECRET: $$cap_auth0_client_secret
      OAUTH2_PROXY_REDIRECT_URL: $$cap_oauth2_redirect_url
      OAUTH2_PROXY_COOKIE_SECRET: $$cap_oauth2_cookie_secret
    caproverExtra:
      containerHttpPort: "8080"

caproverOneClickApp:
  instructions:
    start: |-
      A minimal static HTTP server. CapRover mounts the host datalake at
      /data_mount inside the container. Set DIRECTORY to the subdirectory
      you want to serve under /mnt/persistent-storage/datalake. Optionally set
      DATA_DIRECTORY to expose one additional directory at /data/.

      Leave Enable Auth0 at false to serve files without a login. Set it to
      true only after creating an Auth0 Regular Web Application whose Allowed
      Callback URL is https://<this-app-host>/oauth2/callback. Then fill in
      the issuer, client ID, client secret, and that same callback URL.
      Login is limited to Auth0 users with the Member or Admin role. The
      tenant login flow must add those roles to the ID token as urn:gc:roles.
      Enable Force HTTPS on the app, and do not also enable CapRover HTTP
      Basic Auth.

      Do not edit Persistent Directories per site.
    end: |-
      GC HTTP Server is deploying and will be available within a minute.
      It serves $$cap_data_mount/$$cap_directory via /data_mount/$$cap_directory.
      If configured, $$cap_data_directory is available at /data/.
      When Auth0 is enabled, every mounted path requires a Member or Admin login.
  displayName: Guardian Connector HTTP Server
  isOfficial: true
  description: Tiny static file server for HTML/JS/CSS content from the datalake.
  documentation: https://github.com/ConservationMetrics/gc-http-server
  variables:
    - id: "$$cap_gc_http_server_docker_image"
      label: GC HTTP Server Docker Image
      defaultValue: "<YOUR_REGISTRY>/gc-http-server:latest"
      description: Image name and tag for gc-http-server (your own registry or Docker Hub).

    - id: "$$cap_data_mount"
      label: Host datalake path
      defaultValue: "/mnt/persistent-storage/datalake"
      description: Host path mounted at /data_mount in the container. Leave as default unless your datalake lives elsewhere.

    - id: "$$cap_directory"
      label: Directory
      description: Required. Subdirectory under the datalake to serve.

    - id: "$$cap_data_directory"
      label: Data directory
      defaultValue: ""
      description: Optional. Additional datalake subdirectory exposed at /data/.

    - id: "$$cap_auth_enabled"
      label: Enable Auth0
      defaultValue: "false"
      validRegex: /^(true|false)$/
      description: true requires an Auth0 user with the Member or Admin role before any mounted file is served. false serves the directory without a login.

    - id: "$$cap_auth0_issuer_url"
      label: Auth0 issuer URL
      defaultValue: ""
      description: Required when Auth0 is enabled. Copy the issuer from https://<tenant>/.well-known/openid-configuration, including the trailing slash. Example https://<tenant>.us.auth0.com/

    - id: "$$cap_auth0_client_id"
      label: Auth0 client ID
      defaultValue: ""
      description: Required when Auth0 is enabled. Client ID of the Regular Web Application created for this site.

    - id: "$$cap_auth0_client_secret"
      label: Auth0 client secret
      defaultValue: ""
      description: Required when Auth0 is enabled. Client secret of that same Auth0 application.

    - id: "$$cap_oauth2_redirect_url"
      label: OAuth redirect URL
      defaultValue: ""
      description: Required when Auth0 is enabled. Must be https://<this-app-host>/oauth2/callback and must match an Auth0 Allowed Callback URL exactly.

    - id: "$$cap_oauth2_cookie_secret"
      label: Session cookie secret
      defaultValue: "$$cap_gen_random_hex(32)"
      description: Secret used to sign the login cookie. A random value is generated for a new app. To replace it, use the output of openssl rand -base64 32.
